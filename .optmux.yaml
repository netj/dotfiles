# for https://github.com/netj/optmux
# (the extrakto plugin and C-M-x are bundled with optmux now, so they're no longer repeated here)
optmux:
  tmux_config:
    # my TMUX config deviating from default
    massive-multi-tasking-pain-killers: |
      set -g renumber-windows on
    basics: |
      set -g history-limit 10000000
      set -g status-keys vi
      setw -g mode-keys vi
      # GNU screen style splits: new pane *before* the current one, same working dir
      unbind '"'; bind '"' split-window -v -b -c "#{pane_current_path}"
      unbind  v ; bind  v  split-window -h -b -c "#{pane_current_path}"
      # record the pane to a log
      bind | pipe-pane -o 'cat >>~/tmux-#S.#I.#P.log'

  shortcuts:
    C-M-n: open -a Terminal .

    C-M-w:
      command: ezgithubopen
      detached: true
      float_window: true
    C-M-k: ezgitprunegone

    # C-M-e:
    #   command: |
    #     test -e NOTES.md || touch NOTES.md; open -a MacVim "$PWD"/NOTES.md
    #   detached: true

    C-M-a:
      tip: |
        reveal the macOS Finder for the working directory so the Stage Manager group holding it can appear
      command: |
        open -R .git; /Applications/BetterTouchTool.app/Contents/SharedSupport/bin/bttcli trigger_named ActivateStageByFinderWindow
      detached: true
      float_window: true
