# os:
#   openLink: 'eval "$(ezurlopen {{link}})"'  # XXX ezurlopen prints the command, doesn't run it (designed for less); vim freezes w/o TTY
promptToReturnFromSubprocess: false
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --hyperlinks --hyperlinks-file-link-format='lazygit-edit://{path}:{line}'
customCommands:
  - key: '<c-g>'
    context: 'global'
    description: 'Diff HEAD against origin/main'
    command: |
      git diff origin/main...
    output: terminal
  - key: '<c-k>'
    context: 'global'
    description: 'Delete gone branches (and worktrees)'
    command: ezgitprunegone
    output: terminal
